<title>Comment l'IA écrit sa réponse ?</title>
<script>
/* =====================================================================
   TOUS LES TEXTES DE LA PAGE
   Dao, c'est ici que vous pouvez modifier les mots.
   Règle simple : changer seulement ce qui est entre guillemets "...".
   Si une phrase contient une apostrophe ('), elle reste entre guillemets "...".
   ===================================================================== */
const TEXTES = {
  titrePage: "Comment l'IA écrit sa réponse ?",
  boutonRecommencer: "↺ Recommencer",
  progression: "Scène {s} sur {total}",
  fin: "Fin",

  /* Premier écran : une question au groupe, avant l'accueil */
  question: {
    texte: "Quand vous posez une question à l'IA, vous lui faites complètement confiance ?"
  },

  accueil: {
    titre: "Comment l'IA écrit sa réponse ?",
    sousTitre: "Trois idées simples pour recourir à l'IA les yeux ouverts",
    aide: "Pour avancer : clic, barre d'espace ou flèche droite. Pour revenir : flèche gauche."
  },

  scene1: {
    titre: "Le jeu de la suite",
    debut: "Le chat dort sur le",
    trou: "…",
    choix: [
      { mot: "canapé", pourcent: 45 },
      { mot: "lit",    pourcent: 30 },
      { mot: "tapis",  pourcent: 15 },
      { mot: "toit",   pourcent: 10 }
    ],
    etiquetteChoisi: "◀ le plus probable",
    mention: "⚠ Chiffres inventés pour l'exemple",
    message: "L'IA fait comme vous : elle devine le mot le plus probable."
  },

  scene2: {
    titre: "Morceau par morceau",
    morceaux: ["Je", "cherche", "un", "appart", "ement", "à", "Laus", "anne", "."],
    mention: "⚠ Découpage simplifié pour l'exemple",
    /* Remarque facultative : mettre "" pour la supprimer */
    remarque: "Un morceau n'est pas toujours un mot entier : « appart » + « ement ».",
    morceauxRemarque: [3, 4],   /* position des morceaux à entourer (0 = le premier) */
    message: "L'IA écrit morceau par morceau, comme on enfile des perles."
  },

  scene3: {
    titre: "Moment 1 : pendant qu'elle écrit",
    etiquetteEcrit: "À l'écrit, l'IA :",
    ecrit1: "Fribourg, en Suisse romande,",

    motFaux: "francophone",
    marqueFaux: "✗ faux",
    gomme: "La gomme essaie d'effacer… impossible : le mot reste.",
    suiteAvant: "… non, c'est un canton",
    motJuste: "bilingue.",
    suiteApres: "",
    marqueJuste: "✓ juste",
    etiquetteOral: "À l'oral, un·e apprenant·e :",
    oral1: "Hier,",
    oralFaux: "j'ai allé…",
    oral2: "non,",
    oralJuste: "je suis allé",
    oralApres: "à la gare.",
    message: "Pendant qu'elle écrit, elle ne peut rien effacer. Elle se corrige en avançant, comme un·e apprenant·e à l'oral."
  },

  scene4: {
    titre: "Moment 2 : dans une nouvelle réponse",
    vous: "Vous",
    ia: "IA",
    question: "Le canton de Fribourg est-il francophone ?",
    reponse1: "Oui, le canton de Fribourg est francophone.",
    relance: "C'est vraiment juste ?",
    relecture: "Elle relit toute la conversation",
    reponse2: "Je corrige : le canton de Fribourg est bilingue, on y parle français et suisse allemand.",
    rienEfface: "◀ toujours là : rien n'a été effacé",
    message: "Dans une nouvelle réponse, elle relit tout. C'est souvent votre question qui déclenche la correction."
  },

  scene5: {
    titre: "Attention : douter ne suffit pas",
    vous: "Vous",
    ia: "IA",
    question: "Combien de cantons compte la Suisse ?",
    reponse1: "La Suisse compte 26 cantons.",
    marqueJuste: "✓ juste",
    relance: "C'est vraiment juste ?",
    reponse2: "Vous avez raison, je corrige : 23 cantons.",
    marqueFaux: "✗ faux",
    message: "Une relance peut aussi lui faire abandonner une bonne réponse. Votre question ne remplace pas la vérification."
  },

  scene6: {
    titre: "Le chemin d'une réponse",
    /* Les six cases, dans l'ordre. La dernière est mise en valeur. */
    etapes: [
      "Vous écrivez",
      "Elle découpe en morceaux",
      "Elle devine le morceau suivant",

  },

  scene7: {
    titre: "Ce qu'on retient",
    /* Chaque verbe apparaît, puis sa phrase en dessous. */
    verbes: [
      { verbe: "Réfléchis.", phrase: "Elle devine, elle ne sait pas." },
      { verbe: "Prompte.",   phrase: "Une bonne question l'aide à se relire." },
      { verbe: "Vérifie.",   phrase: "Probable ne veut pas dire vrai." }
    ]

</script>
<style>
  :root {
    --texte: #111111;
    --fond: #ffffff;
    --gris: #444444;
    --accent: #0b3d91;
    --doux: #e8eefa;
    --faux: #a40e0e;
    --juste: #1b5e20;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--fond);
    color: var(--texte);
    font-family: Arial, Helvetica, sans-serif;
  }
  body { cursor: pointer; user-select: none; }

  /* Scène fixe 1920 × 1080, mise à l'échelle de l'écran.
     Aucun texte n'est en dessous de 32 px dans ce repère. */
  #scene {
    position: absolute;
    left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    font-size: 48px;
    line-height: 1.3;
  }
  #contenu { position: absolute; inset: 0; padding: 50px 90px 0; }

  #recommencer {
    position: absolute; top: 24px; right: 30px; z-index: 10;
    font: 32px Arial, Helvetica, sans-serif;
    color: var(--gris); background: var(--fond);
    border: 2px solid #888; border-radius: 12px;
    padding: 6px 20px; cursor: pointer; opacity: .7;
  }
  #recommencer:hover, #recommencer:focus-visible { opacity: 1; outline: 4px solid var(--accent); }
  #progression {
    position: absolute; left: 90px; bottom: 26px;
    font-size: 32px; color: var(--gris);
  }

  /* --- Mécanique pas à pas --- */
  [data-etape] { opacity: 0; visibility: hidden; }
  [data-etape].visible {
    opacity: 1; visibility: visible;
    transition: opacity .6s ease var(--d, 0s), visibility 0s linear var(--d, 0s);
  }
  [data-jusqua]:not(.visible), .sansplace:not(.visible) { display: none; }
  .instant *, .instant *::before, .instant *::after { transition: none !important; animation: none !important; }

  /* --- Éléments communs --- */
  h2 {
    font-size: 64px; color: var(--accent);
    border-bottom: 6px solid var(--accent);
    padding: 0 340px 12px 0; margin-bottom: 50px;
  }
  .message {
    position: absolute; left: 90px; right: 90px; bottom: 100px;
    background: var(--doux);
    border-left: 16px solid var(--accent);
    padding: 26px 40px;
    font-size: 52px; font-weight: bold;
  }
  .mention { font-size: 36px; font-style: italic; color: var(--gris); margin-top: 30px; }
  .marque {
    display: inline-block; font-size: 36px; font-weight: bold;
    border: 4px solid currentColor; border-radius: 12px;
    padding: 0 12px; margin: 0 6px; vertical-align: middle; line-height: 1.3;
  }
  .marque-faux { color: var(--faux); }
  .marque-juste { color: var(--juste); }
  .faux { color: var(--faux); text-decoration: underline wavy var(--faux); text-decoration-thickness: 4px; text-underline-offset: 10px; }
  .juste { color: var(--juste); font-weight: bold; text-decoration: underline double var(--juste); text-decoration-thickness: 4px; text-underline-offset: 10px; }
  .curseur {
    display: inline-block; width: 6px; height: 1em; background: var(--texte);
    vertical-align: -0.12em; margin-left: 4px;
  }
  .curseur.visible { animation: clignote 1s steps(1) infinite; }
  @keyframes clignote { 50% { opacity: 0; } }

  /* --- Accueil --- */
  .accueil { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-bottom: 80px; }
  .accueil h1 { font-size: 104px; color: var(--accent); margin-bottom: 40px; }
  .accueil .sous { font-size: 52px; margin-bottom: 90px; }
  .accueil .aide { font-size: 36px; color: var(--gris); border: 3px dashed #888; border-radius: 16px; padding: 18px 36px; }

  /* --- Scène 1 --- */
  .phrase { font-size: 88px; font-weight: bold; margin-bottom: 50px; }
  .trou { color: var(--gris); }
  .mot-choisi { color: var(--accent); text-decoration: underline; text-decoration-thickness: 6px; text-underline-offset: 14px; }
  .barres { display: grid; grid-template-columns: 240px 1000px 160px auto; gap: 22px 30px; align-items: center; font-size: 52px; }
  .barres > div { display: contents; }
  .piste { height: 70px; border: 4px solid var(--texte); background: var(--fond); }
  .remplissage { height: 100%; width: 0; background: var(--accent); transition: width 1.2s ease var(--d, 0s); }
  .visible .remplissage { width: var(--pct); }
  .pct { font-weight: bold; text-align: right; }
  .choisi .nom { font-weight: bold; text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 10px; }
  .choisi .piste { border-width: 8px; }
  .tag-choisi { font-size: 40px; font-weight: bold; color: var(--accent); }

  /* --- Scène 2 --- */
  .collier { display: flex; flex-wrap: wrap; row-gap: 40px; margin: 70px 0 20px; }
  .perle-fil {
    padding: 0 16px;
    background: linear-gradient(#555, #555) center / 100% 6px no-repeat;
    display: flex; align-items: center;
  }
  .perle {
    display: inline-block; font-size: 72px; font-weight: bold;
    padding: 14px 34px; border: 5px solid var(--texte); border-radius: 999px;
    transition: opacity .5s ease, transform .5s ease;
    transform: scale(.6);
  }
  .perle.visible { transform: scale(1); }
  .p0 { background: #ffd6a5; } .p1 { background: #caffbf; } .p2 { background: #a0e7ff; } .p3 { background: #ffc6ff; }
  .entoure { outline: 8px dashed var(--accent); outline-offset: 10px; }
  .remarque { font-size: 48px; font-weight: bold; margin-top: 40px; }

  /* --- Scène 3 --- */
  .colonnes { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
  .boite { border: 4px solid var(--texte); border-radius: 20px; padding: 22px 34px; min-height: 480px; }
  .boite .etiquette { font-size: 40px; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
  .boite .texte { font-size: 50px; line-height: 1.5; }
  .zone-faux { position: relative; display: inline-block; }
  .gomme {
    position: absolute; left: 50%; top: -10px; margin-left: -85px;
    pointer-events: none; opacity: 0;
  }
  .gomme.visible { animation: gommer 2.6s ease-in-out forwards; }
  @keyframes gommer {
    0%   { transform: translate(300px, -180px); opacity: 0; }
    15%  { transform: translate(0, 10px); opacity: 1; }
    25%  { transform: translate(-60px, 16px); }
    35%  { transform: translate(60px, 8px); }
    45%  { transform: translate(-60px, 16px); }
    55%  { transform: translate(60px, 8px); }
    65%  { transform: translate(-40px, 14px); }
    75%  { transform: translate(0, 10px); }
    90%  { transform: translate(300px, -180px); opacity: 1; }
    100% { transform: translate(300px, -180px); opacity: 0; }
  }
  .instant .gomme { display: none; }
  .note-gomme { font-size: 38px; font-style: italic; color: var(--faux); margin-top: 20px; font-weight: bold; }
  .bulle-orale {
    font-size: 50px; line-height: 1.5;
    border: 4px dashed var(--texte); border-radius: 40px; padding: 20px 30px;
  }
  .bulle-orale::before { content: "🗣 "; }

  /* --- Scène 4 --- */
  .s4 { position: relative; }
  .cote {
    position: absolute; left: 0; top: 0; width: 300px;
    font-size: 38px; font-weight: bold; color: var(--accent); text-align: center;
  }
  .cote .fleche { font-size: 140px; line-height: 1; display: block; }
  .fil { position: relative; margin-left: 340px; display: flex; flex-direction: column; gap: 18px; margin-top: -10px; }
  .ligne { display: flex; align-items: center; gap: 24px; }
  .ligne.vous { justify-content: flex-end; }
  .bulle {
    font-size: 40px; padding: 16px 28px; border-radius: 24px;
    border: 4px solid var(--texte); max-width: 1150px;
  }
  .vous .bulle { background: var(--doux); }
  .ia .bulle { background: var(--fond); }
  .qui { font-weight: bold; margin-right: 14px; padding: 0 12px; border: 3px solid var(--texte); border-radius: 10px; font-size: 36px; vertical-align: middle; }
  .garde { outline: 8px dashed var(--accent); outline-offset: 6px; }
  .tag-efface { font-size: 38px; font-weight: bold; color: var(--accent); max-width: 380px; }
  .balayage {
    position: absolute; left: -24px; right: -24px; height: 130px; bottom: 0;
    border-top: 10px solid var(--accent);
    background: linear-gradient(to bottom, rgba(11,61,145,.30), rgba(11,61,145,0));
    pointer-events: none;
  }
  .balayage.visible { animation: balayer 2.4s ease-in-out forwards; }
  @keyframes balayer {
    0%   { bottom: 0; opacity: 1; }
    85%  { bottom: calc(100% - 130px); opacity: 1; }
    100% { bottom: calc(100% - 130px); opacity: 0; }
  }
  .instant .balayage { display: none; }

  /* --- Question au groupe --- */
  .question-groupe { font-size: 88px; font-weight: bold; line-height: 1.35; max-width: 1600px; color: var(--accent); }

  /* --- Scène 5 : le contre-exemple --- */
  .fil-seul { margin-left: 0; }
  .bulle-juste { outline: 6px solid var(--juste); outline-offset: 6px; }
  .bulle-faux { outline: 6px dashed var(--faux); outline-offset: 6px; }

  /* --- Scène 6 : le chemin d'une réponse --- */
  .chemin {
    display: grid; grid-template-columns: 1.3fr 90px 1fr 90px 1fr;
    grid-template-rows: 230px 90px 270px; align-items: stretch;
  }
  .case {
    position: relative; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 44px; line-height: 1.25; padding: 20px 26px 20px 70px;
    border: 4px dashed #767676; border-radius: 24px; color: #6a6a6a; background: var(--fond);
    transition: background .5s ease, color .5s ease;
  }
  .case .num {
    position: absolute; left: 16px; top: 14px; font-size: 40px; font-weight: bold;
    border: 3px solid currentColor; border-radius: 50%; width: 58px; height: 58px;

  }
  .case.allumee { border: 8px solid var(--accent); background: var(--accent); color: #ffffff; font-weight: bold; }
  .case.passee { border: 5px solid var(--accent); background: var(--doux); color: var(--texte); font-weight: normal; }
  .case-finale { font-size: 60px; font-weight: bold; }
  .case-finale.allumee, .case-finale.passee { border-width: 12px; }
  .case-finale.allumee::after { content: "★"; position: absolute; right: 18px; top: 8px; font-size: 48px; }

  .verbes { display: flex; justify-content: space-between; gap: 40px; margin-top: 30px; }

  @media print { #recommencer, #progression { display: none; } }
</style>

<body>
<div id="scene">
  <div id="contenu"></div>
  <button id="recommencer" type="button"></button>
  <div id="progression" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  /* Espaces insécables avant ? ! : ; (typographie française) */
  function typo(t) { return String(t).replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« "); }

  /* Fabrique un élément.  e = étape d'apparition, j = dernière étape où il reste visible,
     a = "4:classe" ajoute une classe à partir de l'étape 4, d = délai en secondes. */
  function h(tag, o, ...enfants) {
    const n = document.createElement(tag);
    o = o || {};
    if (o.c) n.className = o.c;
    if (o.e !== undefined) n.dataset.etape = o.e;
    if (o.j !== undefined) n.dataset.jusqua = o.j;
    if (o.a) n.dataset.ajoute = o.a;
    if (o.d) n.style.setProperty("--d", o.d + "s");
    if (o.html) n.innerHTML = o.html;
    for (const x of enfants) {
      if (x === null || x === undefined || x === false) continue;
      n.append(typeof x === "string" ? document.createTextNode(typo(x)) : x);
    }
    return n;
  }
  const esp = () => document.createTextNode(" ");
  /* Une suite de mots qui apparaissent l'un après l'autre à la même étape */
  function mots(texte, etape, debut) {
    const frag = document.createDocumentFragment();
    texte.split(" ").filter(m => m).forEach((m, i) => {
      frag.append(h("span", { e: etape, d: (debut || 0) + i * 0.35 }, m), esp());
    });
    return frag;
  }
  const message = (texte, etape) => h("div", { c: "message", e: etape }, texte);

  const GOMME_SVG =
    '<svg width="170" height="90" viewBox="0 0 170 90" aria-hidden="true"><g transform="rotate(-18 85 45)">' +
    '<rect x="10" y="22" width="150" height="50" rx="10" fill="#f48fb1" stroke="#111" stroke-width="4"/>' +
    '<rect x="10" y="22" width="68" height="50" rx="10" fill="#1e63c4" stroke="#111" stroke-width="4"/></g></svg>';

  /* ---------------- LES SCÈNES ---------------- */
  const SCENES = [
    function question() {
      return h("div", { c: "accueil" },
        h("p", { c: "question-groupe", e: 0 }, TEXTES.question.texte));
    },

    function accueil() {
      const t = TEXTES.accueil;
      return h("div", { c: "accueil" },
        h("h1", { e: 0 }, t.titre),
        h("p", { c: "sous", e: 0, d: 0.4 }, t.sousTitre),
        h("p", { c: "aide", e: 0, d: 0.8 }, t.aide));
    },

    function scene1() {
      const t = TEXTES.scene1;
      const barres = h("div", { c: "barres", e: 1 });
      t.choix.forEach((c, i) => {
        const piste = h("div", { c: "piste" }, h("div", { c: "remplissage", d: i * 0.3 }));
        piste.firstChild.style.setProperty("--pct", c.pourcent + "%");
        barres.append(h("div", i === 0 ? { a: "2:choisi" } : {},
          h("span", { c: "nom" }, c.mot),
          piste,
          h("span", { c: "pct" }, c.pourcent + " %"),
          i === 0 ? h("span", { c: "tag-choisi", e: 2 }, t.etiquetteChoisi) : h("span")));
      });
      const premier = t.choix[0].mot;
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("p", { c: "phrase", e: 0 }, t.debut + " ",
          h("span", { c: "trou", e: 0, j: 1 }, t.trou),
          h("span", { c: "mot-choisi sansplace", e: 2 }, premier)),
        barres,
        h("p", { c: "mention", e: 1 }, t.mention),
        message(t.message, 3));
    },

    function scene2() {
      const t = TEXTES.scene2;
      const collier = h("div", { c: "collier" });
      t.morceaux.forEach((m, i) => {
        const marque = t.remarque && t.morceauxRemarque.includes(i) ? { a: (t.morceaux.length + 1) + ":entoure" } : {};
        collier.append(h("span", { c: "perle-fil" },
          h("span", Object.assign({ c: "perle p" + (i % 4), e: i + 1 }, marque), m)));
      });
      let etape = t.morceaux.length + 1;
      const remarque = t.remarque ? h("p", { c: "remarque", e: etape++ }, t.remarque) : null;
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        collier,
        h("p", { c: "mention", e: 1 }, t.mention),
        remarque,
        message(t.message, etape));
    },

    function scene3() {
      const t = TEXTES.scene3;
      const ecrit = h("div", { c: "texte" },
        mots(t.ecrit1, 1), h("span", { c: "curseur", e: 1, j: 1 }),
        mots(t.ecrit2, 2), h("span", { c: "curseur", e: 2, j: 2 }),
        h("span", { c: "zone-faux" },
          h("span", { e: 3, a: "4:faux" }, t.motFaux),
          h("span", { c: "gomme", e: 5, j: 5, html: GOMME_SVG })),
        h("span", { c: "marque marque-faux sansplace", e: 4 }, t.marqueFaux),
        h("span", { c: "curseur", e: 3, j: 5 }), esp(),
        mots(t.suiteAvant, 6),
        h("span", { e: 6, d: 0.7, a: "6:juste" }, t.motJuste), esp(),
        h("span", { c: "marque marque-juste sansplace", e: 6, d: 1.0 }, t.marqueJuste), esp(),
        mots(t.suiteApres, 6, 1.2),
        h("span", { c: "curseur", e: 6, j: 6 }));
      const oral = h("div", { c: "bulle-orale" },
        t.oral1 + " ", h("span", { a: "8:faux" }, t.oralFaux),
        h("span", { c: "marque marque-faux sansplace", e: 8 }, t.marqueFaux), esp(),
        h("span", { e: 8 }, t.oral2 + " "),
        h("span", { e: 8, a: "8:juste" }, t.oralJuste),
        h("span", { c: "marque marque-juste sansplace", e: 8, d: 0.4 }, t.marqueJuste), esp(),
        h("span", { e: 8, d: 0.4 }, t.oralApres));
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("div", { c: "colonnes" },
          h("div", { c: "boite", e: 0 },
            h("p", { c: "etiquette" }, t.etiquetteEcrit), ecrit,
            h("p", { c: "note-gomme", e: 5, d: 2.6 }, t.gomme)),
          h("div", { c: "boite", e: 7 },
            h("p", { c: "etiquette" }, t.etiquetteOral), oral)),
        message(t.message, 9));
    },

    function scene4() {
      const t = TEXTES.scene4;
      const qui = (nom) => h("span", { c: "qui" }, nom);
      const fil = h("div", { c: "fil" },
        h("div", { c: "ligne vous", e: 0 }, h("div", { c: "bulle" }, qui(t.vous), t.question)),
        h("div", { c: "ligne ia", e: 0, d: 0.4 },
          h("div", { c: "bulle", a: "4:garde" }, qui(t.ia), t.reponse1),
          h("span", { c: "tag-efface sansplace", e: 4 }, t.rienEfface)),
        h("div", { c: "ligne vous sansplace", e: 1 }, h("div", { c: "bulle" }, qui(t.vous), t.relance)),
        h("div", { c: "ligne ia sansplace", e: 3 }, h("div", { c: "bulle" }, qui(t.ia), t.reponse2)),
        h("div", { c: "balayage", e: 2, j: 2 }));
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("div", { c: "s4" },
          h("div", { c: "cote", e: 2 }, h("span", { c: "fleche" }, "↑"), t.relecture),
          fil),
        message(t.message, 5));
    },

    function scene5() {
      const t = TEXTES.scene5;
      const qui = (nom) => h("span", { c: "qui" }, nom);
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("div", { c: "s4" },
          h("div", { c: "fil fil-seul" },
            h("div", { c: "ligne vous", e: 0 }, h("div", { c: "bulle" }, qui(t.vous), t.question)),
            h("div", { c: "ligne ia", e: 0, d: 0.4 },
              h("div", { c: "bulle", a: "1:bulle-juste" }, qui(t.ia), t.reponse1),
              h("span", { c: "marque marque-juste sansplace", e: 1 }, t.marqueJuste)),
            h("div", { c: "ligne vous sansplace", e: 2 }, h("div", { c: "bulle" }, qui(t.vous), t.relance)),
            h("div", { c: "ligne ia sansplace", e: 3 },
              h("div", { c: "bulle", a: "4:bulle-faux" }, qui(t.ia), t.reponse2),
              h("span", { c: "marque marque-faux sansplace", e: 4 }, t.marqueFaux)))),
        message(t.message, 5));
    },

    function scene6() {
      const t = TEXTES.scene6;
      const n = t.etapes.length;
      /* Chaque case s'allume à son clic, la case du clic en cours est soulignée */
      const kase = (i) => h("div", {
          c: "case" + (i === n - 1 ? " case-finale" : ""),
          a: (i + 1) + ":allumee" + (i < n - 1 ? ";" + (i + 2) + ":passee" : "")
        }, h("span", { c: "num" }, String(i + 1)), t.etapes[i]);
      const fl = (sens) => h("div", { c: "fleche-chemin" }, sens);
      /* Disposition en boucle : 1 → 2 → 3, puis ↓, puis 6 ← 5 ← 4, puis ↑ vers 1 */
      const grille = h("div", { c: "chemin" },
        kase(0), fl("→"), kase(1), fl("→"), kase(2),
        fl("↑"), h("div"), h("div"), h("div"), fl("↓"),
        kase(5), fl("←"), kase(4), fl("←"), kase(3));
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("div", { e: 0 }, grille),
        message(t.message, n + 1));
    },

    function scene7() {
      const t = TEXTES.scene7;
      return h("div", {},
        h("h2", { e: 0 }, t.titre),
        h("div", { c: "verbes" }, ...t.verbes.map((v, i) =>
          h("div", { c: "colonne-verbe" },
            h("div", { c: "verbe", e: 2 * i + 1 }, v.verbe),
            h("p", { c: "phrase-verbe", e: 2 * i + 2 }, v.phrase)))));
    }
  ];

  /* ---------------- NAVIGATION ---------------- */
  const scene = document.getElementById("scene");
  const contenu = document.getElementById("contenu");
  const progression = document.getElementById("progression");
  const bouton = document.getElementById("recommencer");
  document.title = TEXTES.titrePage;
  bouton.textContent = TEXTES.boutonRecommencer;

  let numScene = 0, etape = 0, nbEtapes = 1;

  function construire() {
    contenu.innerHTML = "";
    contenu.append(SCENES[numScene]());
    nbEtapes = 1;
    contenu.querySelectorAll("[data-etape]").forEach(n => { nbEtapes = Math.max(nbEtapes, +n.dataset.etape + 1); });
    void contenu.offsetWidth; /* pour que les premières apparitions soient animées */
  }

  function appliquer(instant) {
    contenu.classList.toggle("instant", instant);
    contenu.querySelectorAll("[data-etape]").forEach(n => {
      const debut = +n.dataset.etape;
      const fin = n.dataset.jusqua !== undefined ? +n.dataset.jusqua : Infinity;
      n.classList.toggle("visible", etape >= debut && etape <= fin);
    });
    contenu.querySelectorAll("[data-ajoute]").forEach(n => {
      n.dataset.ajoute.split(";").forEach(regle => {
        const [num, classe] = regle.split(":");
        n.classList.toggle(classe, etape >= +num);
      });
    });
    const AVANT = 2; /* question au groupe + accueil, sans numéro */
    const total = SCENES.length - AVANT;
    const derniere = numScene === SCENES.length - 1 && etape === nbEtapes - 1;
    progression.textContent = numScene < AVANT ? "" :
      TEXTES.progression.replace("{s}", numScene - AVANT + 1).replace("{total}", total) +
      "  ·  " + (etape + 1) + "/" + nbEtapes + (derniere ? "  ·  " + TEXTES.fin : "");
  }

  function suivant() {
    if (etape < nbEtapes - 1) { etape++; }
    else if (numScene < SCENES.length - 1) { numScene++; etape = 0; construire(); }
    else return;
    appliquer(false);
  }
  function precedent() {
    if (etape > 0) { etape--; }
    else if (numScene > 0) { numScene--; construire(); etape = nbEtapes - 1; }
    else return;
    appliquer(true);
  }
  function recommencer() { numScene = 0; etape = 0; construire(); appliquer(false); }

  document.addEventListener("click", e => { if (e.button === 0) suivant(); });
  bouton.addEventListener("click", e => { e.stopPropagation(); recommencer(); bouton.blur(); });
  document.addEventListener("keydown", e => {
    if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); suivant(); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); precedent(); }
    else if (e.key === "Home") { e.preventDefault(); recommencer(); }
  });

  function ajuster() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    scene.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", ajuster);
  ajuster();
  construire();
  appliquer(false);
})();
</script>
</body>
</html>
